<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 130" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c0e17" />
      <stop offset="50%" stop-color="#141828" />
      <stop offset="100%" stop-color="#090a12" />
    </linearGradient>

    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7dcfff" />
      <stop offset="50%" stop-color="#b482ff" />
      <stop offset="100%" stop-color="#78e6a0" />
    </linearGradient>

    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7dcfff" />
      <stop offset="40%" stop-color="#b482ff" />
      <stop offset="80%" stop-color="#78e6a0" />
      <stop offset="100%" stop-color="#ffc66d" />
    </linearGradient>

    <filter id="bannerGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <style>
      @keyframes blink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0; }
      }
      @keyframes typeLine1 {
        0% { clip-path: inset(0 100% 0 0); }
        50%, 100% { clip-path: inset(0 0 0 0); }
      }
      @keyframes pulseGlow {
        0%, 100% { filter: drop-shadow(0 0 6px rgba(125, 207, 255, 0.4)); }
        50% { filter: drop-shadow(0 0 16px rgba(180, 130, 255, 0.7)); }
      }
      .title-text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        font-size: 44px;
        font-weight: 900;
        letter-spacing: 2px;
        fill: url(#titleGrad);
        animation: pulseGlow 4s infinite ease-in-out;
      }
      .sub-badge {
        font-family: "JetBrains Mono", "Fira Code", monospace, sans-serif;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 3px;
        fill: #7dcfff;
        opacity: 0.9;
      }
      .typing-content {
        font-family: "JetBrains Mono", "Fira Code", monospace, sans-serif;
        font-size: 15px;
        fill: #e6edf3;
        animation: typeLine1 6s steps(54, end) infinite alternate;
      }
      .cursor {
        font-family: monospace;
        font-size: 16px;
        fill: #7dcfff;
        animation: blink 0.9s infinite;
      }
      .star-twinkle {
        animation: blink 2s infinite ease-in-out;
      }
    </style>
  </defs>

  <!-- Banner Card Base -->
  <rect x="2" y="2" width="896" height="126" rx="16" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="2" />

  <!-- Background Ambient Glow & Starlets -->
  <circle cx="50" cy="30" r="1.5" fill="#7dcfff" opacity="0.6" class="star-twinkle" />
  <circle cx="850" cy="40" r="2" fill="#b482ff" opacity="0.7" class="star-twinkle" style="animation-delay: 1s;" />
  <circle cx="820" cy="95" r="1.5" fill="#78e6a0" opacity="0.8" class="star-twinkle" style="animation-delay: 0.5s;" />
  <circle cx="80" cy="100" r="1.8" fill="#ffffff" opacity="0.5" class="star-twinkle" style="animation-delay: 1.5s;" />

  <!-- Top Pill / Super-title -->
  <text x="450" y="28" text-anchor="middle" class="sub-badge">✦ COSMIC DISK SPACE ANALYZER &amp; HEATMAP FOR LINUX ✦</text>

  <!-- Main Animated Gradient Title -->
  <text x="450" y="74" text-anchor="middle" class="title-text">🪐 S P A C E S A G E</text>

  <!-- Animated Typing Text with Cursor -->
  <g transform="translate(450, 106)">
    <text text-anchor="middle" class="typing-content">
      $ spacesage --analyze / &#160;▸ Find what's eating your disk &amp; what's safe to delete
    </text>
  </g>
</svg>
